<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="astroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a08"/>
      <stop offset="100%" stop-color="#090505"/>
    </linearGradient>
    <radialGradient id="marsGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#astroBg)"/>

  <!-- Orbital Rings & Planetary Terrain Elements -->
  <g transform="translate(400, 210)">
    <!-- Orbital trajectory ellipse -->
    <ellipse cx="0" cy="0" rx="220" ry="85" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 6"/>
    <ellipse cx="0" cy="0" rx="270" ry="110" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>

    <!-- Mars Planet Body -->
    <circle cx="0" cy="0" r="95" fill="url(#marsGrad)" stroke="#ea580c" stroke-width="2"/>
    
    <!-- Topography terrain lines on planet surface -->
    <path d="M-80 -20 Q -40 -40, 20 -10 T 80 -30" stroke="#9a3412" stroke-width="2.5" fill="none"/>
    <path d="M-90 10 Q -30 30, 30 15 T 85 20" stroke="#9a3412" stroke-width="2.5" fill="none"/>
    <path d="M-75 45 Q -10 60, 60 45" stroke="#9a3412" stroke-width="2.5" fill="none"/>

    <!-- Target Landing Reticle (Mars Space Apps) -->
    <circle cx="-35" cy="-20" r="14" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <line x1="-35" y1="-38" x2="-35" y2="-2" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="-53" y1="-20" x2="-17" y2="-20" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="-35" cy="-20" r="3" fill="#38bdf8"/>

    <!-- Telemetry pointer -->
    <polyline points="-35,-20 -90,-80 -180,-80" stroke="#06b6d4" stroke-width="1.5" fill="none"/>
    <text x="-180" y="-90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">JEZERO CRATER // LZ-ALPHA</text>
  </g>

  <!-- Title Badge -->
  <rect x="200" y="390" width="400" height="48" rx="8" fill="#180e0c" stroke="#f97316" stroke-width="1"/>
  <text x="400" y="420" fill="#ffedd5" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">PROJECT ASTRO // NASA SPACE APPS 2026</text>
</svg>
