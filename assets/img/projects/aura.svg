<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#auraBg)"/>

  <!-- Technical Neural Connections -->
  <g transform="translate(400, 210)">
    <!-- Central Brain/Core Sphere -->
    <circle cx="0" cy="0" r="85" fill="#111827" stroke="url(#neuralGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#06b6d4"/>

    <!-- Neural Nodes & Synaptic Vectors -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3">
      <line x1="0" y1="0" x2="-140" y2="-70"/>
      <line x1="0" y1="0" x2="140" y2="-70"/>
      <line x1="0" y1="0" x2="-150" y2="60"/>
      <line x1="0" y1="0" x2="150" y2="60"/>
      <line x1="0" y1="0" x2="0" y2="-130"/>
    </g>

    <!-- Satellite Nodes -->
    <circle cx="-140" cy="-70" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="140" cy="-70" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="-150" cy="60" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="60" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-130" r="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <rect x="230" y="390" width="340" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="420" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">AURA AI // ACADEMIC RESEARCH ASSISTANT</text>
</svg>
